version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: carpool-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_114514
      MYSQL_DATABASE: carpool
      MYSQL_USER: carpool
      MYSQL_PASSWORD: carpool_password
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./script/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - carpool-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 后端服务
  backend:
    build:
      context: ./carpool-b
      dockerfile: Dockerfile
    container_name: carpool-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/carpool?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: carpool
      SPRING_DATASOURCE_PASSWORD: carpool_password
      TZ: Asia/Shanghai
    volumes:
      - backend_logs:/app/logs
    networks:
      - carpool-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务
  frontend:
    build:
      context: ./carpool-f
      dockerfile: Dockerfile
    container_name: carpool-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      TZ: Asia/Shanghai
    networks:
      - carpool-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # 数据采集服务
  collector:
    build:
      context: ./script
      dockerfile: Dockerfile
    container_name: carpool-collector
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      CONFIG_PATH: /app/config.json
    volumes:
      - collector_logs:/app/logs
      - ./script/config.json:/app/config.json:ro
    networks:
      - carpool-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python.*run_docker.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

# 数据卷
volumes:
  mysql_data:
    driver: local
  backend_logs:
    driver: local
  collector_logs:
    driver: local

# 网络
networks:
  carpool-network:
    driver: bridge
