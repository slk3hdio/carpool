spring.application.name=carpool

# 服务器配置
server.port=8080
server.servlet.context-path=/api

# 数据库配置 (Docker 环境)
spring.datasource.url=jdbc:mysql://mysql:3306/carpool?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
spring.datasource.username=carpool
spring.datasource.password=carpool_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson配置
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.serialization.write-dates-as-timestamps=false

# 日志配置
logging.level.com.example.carpool=INFO
logging.level.org.hibernate.SQL=INFO
logging.file.name=/app/logs/app.log
logging.file.max-size=10MB
logging.file.max-history=7

# CORS配置
spring.web.cors.allowed-origins=http://localhost,http://frontend
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
